<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Painel 2027 | GR Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="../web/logo.png" alt="GR Capital">
    <div class="controls" id="controls" hidden>
      <label class="sr-only" for="view">Visão</label>
      <select id="view"></select>
      <button type="button" class="ghost" id="refresh">Atualizar</button>
      <button type="button" class="ghost" id="pdf-zip">PDFs por assessor (.zip)</button>
      <button type="button" class="ghost" id="pdf-full">Relatório completo (PDF)</button>
      <button type="button" class="ghost" id="logout">Sair</button>
    </div>
  </header>
  <div class="status" id="status" hidden></div>

  <main id="login" class="login" hidden>
    <div class="kicker">GR Capital</div>
    <h1>Painel <span>2027</span></h1>
    <p class="muted">Acompanhamento das respostas do Planejamento 2027.</p>
    <form id="login-form" autocomplete="on">
      <label class="field-label" for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>
      <div class="error" id="login-error" role="alert"></div>
      <button type="submit" class="primary" id="enter">Entrar</button>
    </form>
  </main>

  <main id="dashboard" class="dashboard" hidden></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="../shared/questions.js"></script>
  <script src="../shared/logic.js"></script>
  <script src="../shared/painel-data.js"></script>
  <script src="../web/config.js"></script>
  <script src="painel.js"></script>
</body>
</html>
